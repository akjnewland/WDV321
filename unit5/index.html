<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <form action="#">
    <label>
      Name:
      <input type="text" name="name">
    </label>
    <button type="submit">Submit</button>
  </form>

  <div id="output"></div>

  <script>
    document.querySelector("form").addEventListener("submit", (e) => {
      e.preventDefault();

      fetch('data.json')
        .then(res => res.json())
        .then(data => { 
          data.forEach((datum) => {
            document.getElementById("output").textContent += datum.data;
          });
        });
    })
  </script>
</body>

</html>
