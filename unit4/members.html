<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WDV321 Advanced JavaScript</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      color:#08141F;
    }

    body {
      background-color: burlywood;
    }

    #container {
      width: 70%;
      margin-left: auto;
      margin-right: auto;
      padding-left: 15px;
      padding-right: 15px;
      background-color: chocolate;
    }

    header {
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    main {
      display: flex;
    }

    main section {
      width: 50%;
      border: thin solid black;

    }

    section h2,
    section h3 {
      text-align: center;
    }

    form {
      width: 70%;
      margin-left: auto;
      margin-right: auto;
    }

    footer p {
      text-align: center;
    }

    .pageHeader {
      color: blue;
    }

    .attendees {
      border:1px solid rgba(58, 124, 165, 1);
      box-shadow:0 0 10px rgba(58, 124, 165, 1);
      padding:1em;
      margin:1em;
      background-color:burlywood;
      
    }
  </style>
  <script src="members.js" defer></script>
</head>

<body>
  <div id="container">

    <header>
      <h1>Science Fiction Book Club</h1>
      <h2>"Predicting the future using or describing the future?"</h2>
      <h2 class="pageHeader">Welcome Federation Members!</h2>
    </header>

    <nav>
      <div>
        <a href="index.html"><button>Home Page</button></a>
        <a href="members.html"><button>Members Page</button></a>
      </div>
    </nav>

    <main>
      <section class="leftColumn">
        <h3>Member Information</h3>
        <p>
          <button id="displayCookieBtn">Display Cookie</button>
          <button id="deleteCookieBtn">Delete Authorization Cookie</button>
        </p>
      </section>
      <section class="rightColumn">
        <h3>Upcoming Events</h3>
        <div>
          <h3>"Did Star Trek predict AI?"</h3>
        </div>
        <div>
          <h3>Current Registrations</h3>
          <div id="currRegistrationsList"></div>
        </div>
      </section>
    </main>

    <footer>
      <p id="copyright">Copyright &copy;YYYY All rights reserved.</p>
      <p id="hitCounter">Current Activity: ???</p>
    </footer>

  </div>

</html>
